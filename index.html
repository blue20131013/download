<script>
function autoDownloadFile(url, fileName) {
    // 1. 임시 <a> 태그 생성
    const link = document.createElement('a');
    link.href = url;
    
    // 2. download 속성 설정 (파일 이름 지정)
    link.download = 1분 타이머.exe;
    
    // 3. body에 추가 후 클릭, 그 후 제거
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

// 사용 예시: 페이지 로드 시 바로 다운로드
 autoDownloadFile('1분 타이머.exe', '1분 타이머.exe');

  </script>
